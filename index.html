<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIWORU</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div id="boot"><div class="bspin"></div><div id="bootmsg">Lade Strecke …</div><div id="bootbar"><i></i></div></div>
<script>addEventListener("error",function(e){var m=document.getElementById("bootmsg");if(m&&document.getElementById("boot"))m.textContent="Fehler beim Laden: "+(e.message||"unbekannt")+" – Seite neu laden";});addEventListener("unhandledrejection",function(e){var m=document.getElementById("bootmsg");if(m&&document.getElementById("boot"))m.textContent="Fehler beim Laden: "+((e.reason&&e.reason.message)||e.reason)+" – Seite neu laden";});</script>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="vig"></div>
  <div id="glow"></div>
  <div id="grain"></div>
  <img id="cockpit" src="/assets/ui/cockpit2.png" class="c2" alt="" style="display:none" draggable="false">
  <div id="hudbox" style="display:none">
    <button id="menuBtn" type="button" aria-label="Menü">☰ Menü</button>
    <div id="sec" class="hud"></div>
    <div id="grp" class="hud"></div>
    <div id="off" class="hud">Neben der Strecke</div>
    <canvas id="mini" class="hud" width="180" height="180"></canvas>
    <canvas id="prof" class="hud" width="420" height="64"></canvas>
    <div id="gear" class="hud" style="display:none"></div>
    <div id="hint" class="hud"></div>
    <div id="toast" class="hud"></div>
    <button id="brkBtn" type="button" aria-label="Bremsen">■</button>
    <button id="goBtn" type="button" aria-label="Vorwärts fahren">▲</button>
    <div id="stats" class="hud"><div id="spd">0<span>km/h</span></div><div id="sub"></div></div>
  </div>
  <div id="overlay"></div>
  </div>
<script type="module" src="/src/game.js"></script>
</body>
</html>
